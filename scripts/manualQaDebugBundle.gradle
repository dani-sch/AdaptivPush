// Include a local fallback bundle in the standard debug variant, so cold
// launch can be tested with Metro disconnected. No application identity change.
gradle.beforeProject { project ->
    project.plugins.withId('com.facebook.react') {
        project.extensions.getByName('react').debuggableVariants.set([])
        project.tasks.matching { it.name == 'createBundleDebugJsAndAssets' }.configureEach {
            // Public QA flags are environment inputs; always regenerate them.
            outputs.upToDateWhen { false }
        }
    }
}
